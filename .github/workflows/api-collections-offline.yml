name: API collections offline

# The offline API-collection suites on every pull request (TXE-6055).
#
# The release pipeline's test-api-integrations job runs these suites first, and no PR
# workflow ran them (pr-tests.yml is manual behind the pr-testing approval; e2e-tests.yml
# fires on one upstream branch), so a provider added to StandardProviders without its
# "Provider Secret Redaction" row was caught after the merge by the release run, which
# then published nothing (TXE-6051, run 42335012114). This job runs the same suites on
# the PR: Node and the lockfile-pinned newman, no gateway build, no backing services, no
# provider credentials, no live calls. The suites themselves dial only loopback.
#
# scripts/test-api-collections-offline.sh is the one list of suites, shared with the
# release script; scripts/test-api-collections-offline-callers.py (workflow-lint) keeps
# both callers on it and this trigger unfiltered. No paths filter on purpose: the
# redaction invariant spans core/schemas and tests/e2e/api, and a path-filtered required
# check never reports on a PR outside its paths, which blocks that PR's merge.
#
# The same job runs schemasync (validate-schema-sync.sh), for the same reason (TXE-7064).
# A provider const added to core/schemas without its config.schema.json enum entry passed
# every PR check, and the next chart release and release pipeline on main failed at
# schemasync with "schema missing Go consts [bfl dashscope]" (run 42894713908). Here it
# fails the PR that adds the const. It is in this job because this job is the required
# check; test-api-collections-offline-callers.py keeps the step here.
#
# And check-api-artifacts.sh (TXE-7296): openapi.json, the CLI operation catalog and docs.json's
# API navigation must be what their generators produce from the OpenAPI sources, and the spec
# invariants must hold. Only openapi.json was checked, after the merge (openapi-bundle.yml); the
# catalog fell 86 operations behind and the navigation sync and invariants failed on main while
# every PR passed. Same job, same reason.
#
# And the JavaScript and TypeScript unit tests no other job ran (TXE-7371): the ui vitest suite,
# the CI tools' shims and the security-audit skill's validators. check-js-tests-are-run.py, run
# by the offline suites above, fails a test file that no runner it knows of picks up.

on:
  pull_request:

permissions:
  contents: read

# No concurrency group: this job is a required check, and a group cancels one of two runs on
# the same head (a reopen, a re-run), which leaves the PR blocked beside a passing run
# (TXE-7104). A run on a head a push superseded finishes on its own; it costs minutes, not a
# merge. scripts/check-required-checks-never-cancel.py, in workflow-lint, keeps it so.

jobs:
  api-collections-offline:
    name: API collection offline suites
    # Pull requests from outside contributors, whose head branch is in another
    # repository, run in the pr-testing environment, so they cannot get a runner
    # while it requires a reviewer to approve the run through Review deployments.
    # Everyone else lands on ci-trusted-branch, an environment with no protection
    # rules that only gives the job a name. The job runs the PR's own test code and
    # installs the PR's own lockfile, which is why the boundary applies here; the
    # same expression as workflow-lint, dependency-review and codspeed, evaluated by
    # scripts/test-approval-environment.py.
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'pr-testing' || 'ci-trusted-branch' }}
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # setup-node resolves and downloads Node (api.github.com, github.com,
          # release-assets.githubusercontent.com, nodejs.org); npm ci fetches the pinned
          # tools (registry.npmjs.org). setup-go downloads Go, and schemasync loads the
          # workspace's modules (proxy.golang.org, sum.golang.org, storage.googleapis.com),
          # the hosts the chart release's schemasync step uses. The API-artifact check installs
          # its hash-pinned Python dependencies (pypi.org, files.pythonhosted.org), as workflow-lint does.
          # Nothing else leaves the runner.
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            nodejs.org:443
            proxy.golang.org:443
            pypi.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The Node the release's test-api-integrations job runs these suites with.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "25"

      # The release job's install: npm ci against .github/workflows/tools/package-lock.json,
      # whose integrity hashes cover newman and every transitive dependency. The bin dir
      # goes on PATH because the suites probe for newman with `command -v`.
      - name: Install Newman (hash-pinned via lockfile)
        run: |
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
        working-directory: .github/workflows/tools

      # The suites' Python checks import yaml; a runner's own python3 need not have it.
      - name: Install PyYAML (hash-pinned)
        run: |
          python3 -m pip install --user --disable-pip-version-check \
            --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Run the offline API collection suites
        run: bash .github/workflows/scripts/test-api-collections-offline.sh

      # The newman compatibility shims' tests, on the install above (TXE-7371).
      - name: Test the CI tools' newman compatibility shims
        run: npm test
        working-directory: .github/workflows/tools

      # The ui vitest suite (TXE-7371). It ran in no job, so pricingFields.test.ts pinned a field
      # count two pricing PRs changed from the same base, and main was red with nobody seeing it.
      # npm ci against ui/package-lock.json, whose every package resolves from registry.npmjs.org.
      - name: Install the UI's dependencies (lockfile)
        run: npm ci --no-audit --no-fund
        working-directory: ui

      - name: Run the UI unit tests (vitest)
        run: npx vitest run
        working-directory: ui

      # The security-audit skill's validators (TXE-7371): node:test files, no dependencies.
      - name: Test the security-audit skill's validators
        run: node --test .claude/skills/security-audit/*.test.cjs

      # The Go the chart release and release pipeline run schemasync with.
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"
          cache: false

      # Go config types, transports/config.schema.json and the chart's values schema
      # agree, every Go enum const included (TXE-7064). The chart release runs it too.
      - name: Validate Go ↔ config.schema.json ↔ helm-chart sync (schemasync)
        run: bash .github/workflows/scripts/validate-schema-sync.sh

      # bundle.py needs PyYAML and the spec invariants need jsonschema; --require-hashes against
      # requirements/api-artifacts.txt, so an unverified install never runs here, and nothing is
      # left to whatever the runner image happens to carry.
      - name: Install the API-artifact check's Python dependencies (hash-pinned)
        run: |
          python3 -m pip install --user --disable-pip-version-check \
            --require-hashes -r .github/workflows/requirements/api-artifacts.txt

      # openapi.json, the CLI operation catalog and docs.json's API navigation are regenerated
      # and compared with what is committed, and the spec invariants run (TXE-7296). None of
      # them ran on a PR, and the catalog, the navigation and the invariants drifted on main.
      - name: Check the API artifacts agree with the OpenAPI spec
        run: bash .github/workflows/scripts/check-api-artifacts.sh

      # The check itself: a clean tree passes, and each kind of drift fails it by name and
      # leaves the tree as it was. About a minute; it runs each case's step only.
      - name: Test the API-artifact check
        run: bash .github/workflows/scripts/check-api-artifacts.test.sh
