# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

env:
  # Temporary exception tracked in .github/action-runtime-exceptions.json.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  dependency-review:
    # Pull requests from outside contributors, whose head branch is in another
    # repository, run in the pr-testing environment, so they cannot get a runner
    # while it requires a reviewer to approve the run through Review deployments.
    # Everyone else lands on ci-trusted-branch, an environment with no protection
    # rules that only gives the job a name. Upstream also reads head.repo.fork and
    # author_association; the fork reads neither. txehq/bifrost is itself a fork,
    # so head.repo.fork is true for its own branches, and txehq membership is
    # private, so the event reports its members as non-members. A branch in this
    # repository needs write access, which is the trust this boundary checks.
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'pr-testing' || 'ci-trusted-branch' }}
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: 'Checkout Repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
