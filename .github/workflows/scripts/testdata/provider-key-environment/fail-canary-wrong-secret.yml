# expect: does not set env LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
# The canary reads another secret, so it does not test the environment secret.
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - run: make test-core
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
