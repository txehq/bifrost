# A called workflow whose live-providers job reads only secrets it declares, so a caller that
# passes each by its own name hands the job the environment's values (TXE-7574).
on:
  workflow_call:
    secrets:
      LIVE_PROVIDERS_CANARY: {required: false}
      OPENAI_API_KEY: {required: false}
      AWS_REGION: {required: false}
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          ./.github/workflows/scripts/test-core.sh
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: make build
