# expect: job test-vertex: reads VERTEX_CREDENTIALS, and the job names no environment
# A vendor credential that is not called an API key is still a provider credential.
on: push
jobs:
  test-vertex:
    runs-on: ubuntu-24.04
    steps:
      - run: make test-core PROVIDER=vertex
        env:
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
