# expect: job release: calls ./.github/workflows/pass-called-declares-environment-secrets.yml, whose live-providers jobs read OPENAI_API_KEY, and does not pass each
# An environment secret the caller does not pass reads as empty in the called job, even though
# the job names the environment that holds it (sync.15 release run 44992898623, TXE-7574).
on: push
jobs:
  release:
    uses: ./.github/workflows/pass-called-declares-environment-secrets.yml
    secrets:
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
