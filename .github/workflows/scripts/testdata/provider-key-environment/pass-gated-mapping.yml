# The mapping form of environment, as pr-tests.yml writes it.
on: workflow_dispatch
jobs:
  run-tests:
    runs-on: ubuntu-24.04
    environment:
      name: live-providers
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - run: |
          # A comment before the count is not a command.
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          make test-core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
