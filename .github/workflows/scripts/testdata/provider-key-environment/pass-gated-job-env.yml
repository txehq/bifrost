# The finding's job, gated: a reviewer approves the run before the job gets the keys.
on:
  workflow_dispatch:
    inputs:
      branch: {required: true, type: string}
jobs:
  run-core-tests:
    environment: live-providers
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      # The keys are in the job's env, so a step with none of its own counts them all.
      - run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          ./.github/workflows/scripts/test-core.sh
