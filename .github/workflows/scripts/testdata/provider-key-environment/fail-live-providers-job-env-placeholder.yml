# expect: job test-core: names `environment: live-providers` but sets BFL_API_KEY in its job-level env
# TXE-8192: a registration-only placeholder is still a provider credential's name; at job level
# it would be the place a real key lands the day the placeholder is replaced with a secret.
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    env:
      BFL_API_KEY: registration-only-no-upstream-call
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          ./.github/workflows/scripts/test-core.sh
