# Quotes in a gated job, and a string that only looks like a read in an ungated one.
on: push
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          make test-core
        env:
          OPENAI_API_KEY: ${{ '}}' && secrets.OPENAI_API_KEY }}
  label:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ format('{0}}', 'done') }} secrets.OPENAI_API_KEY is only prose here"
