# expect: job test-core: names `environment: live-providers` in a called workflow and reads secrets dynamically
# No caller can pass by name what a job reads through toJSON(secrets).
on:
  workflow_call:
    secrets:
      LIVE_PROVIDERS_CANARY: {required: false}
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - env:
          ALL: ${{ toJSON(secrets) }}
        run: ./run.sh
