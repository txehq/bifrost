# expect: job gate: reads XAI_API_KEY, checks out the triggering ref, and the job names no environment
# Only the guard's env entries are exempt: a secret read in its run script is checked like any other.
on: push
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
      - id: environment-only-secrets
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          present=""
          for name in \
            LIVE_PROVIDERS_CANARY \
            OPENAI_API_KEY; do
            if [ -n "${!name}" ]; then present="$present $name"; fi
          done
          if [ -n "$present" ]; then exit 1; fi
          echo "${{ secrets.XAI_API_KEY }}" > /tmp/k
      - uses: actions/checkout@v6
      - run: ./decide.sh
  release:
    needs: [gate]
    uses: ./.github/workflows/pass-called-declares-environment-secrets.yml
    secrets:
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
