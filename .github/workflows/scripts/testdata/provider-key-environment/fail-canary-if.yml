# expect: sets `if`
# A conditional canary can be skipped, and a skipped step passes.
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        if: github.event_name == 'push'
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - run: make test-core
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
