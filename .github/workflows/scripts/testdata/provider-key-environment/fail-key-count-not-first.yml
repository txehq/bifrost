# expect: job test-core: names `environment: live-providers` but runs count-provider-keys.py, but not as `python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"` first in its step
# The count runs after the suites, so a suite that exits first leaves the run without it.
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - run: |
          ./.github/workflows/scripts/test-core.sh
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
