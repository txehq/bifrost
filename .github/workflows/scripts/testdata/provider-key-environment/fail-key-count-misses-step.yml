# expect: job test-core: names `environment: live-providers` but reads RUNPOD_API_KEY in a step where count-provider-keys.py does not run
# The count runs in one keyed step, and another step reads a key it never sees, so the count
# says nothing about whether that key arrived.
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          ./.github/workflows/scripts/test-core.sh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: ./.github/workflows/scripts/setup-vllm-runpod.sh
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
