# The caller passes every secret the called live-providers job reads, each as
# NAME: ${{ secrets.NAME }}. Its own value is empty for an environment-only secret, so the
# called job reads the environment's value (measured 2026-11-22, TXE-7574). The gate job it
# needs fails first if any provider credential it passes is a repository or organization
# secret, which would otherwise be the value passed.
on: push
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
      - id: environment-only-secrets
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          present=""
          for name in \
            LIVE_PROVIDERS_CANARY \
            OPENAI_API_KEY; do
            if [ -n "${!name}" ]; then present="$present $name"; fi
          done
          if [ -n "$present" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - run: ./decide.sh
  release:
    needs: [gate]
    uses: ./.github/workflows/pass-called-declares-environment-secrets.yml
    secrets:
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
