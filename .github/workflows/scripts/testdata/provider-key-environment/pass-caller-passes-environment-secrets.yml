# The caller passes every secret the called live-providers job reads, each as
# NAME: ${{ secrets.NAME }}. Its own value is empty for an environment-only secret, so the
# called job reads the environment's value (measured 2026-11-22, TXE-7574).
on: push
jobs:
  release:
    uses: ./.github/workflows/pass-called-declares-environment-secrets.yml
    secrets:
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
