# The word "secrets" inside a string literal of an expression is text, not the context.
on:
  workflow_dispatch:
    inputs:
      label: {required: false, type: string}
jobs:
  notice:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ inputs.label || 'Configure provider secrets first' }}"
      - run: echo "${{ format('see secrets[0] and secrets.OPENAI_API_KEY in {0}', 'docs') }}"
