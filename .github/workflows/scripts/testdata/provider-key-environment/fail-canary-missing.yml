# expect: has no step with id `live-providers-canary`
# A live-providers job with no canary: empty environment secrets would go unnoticed (TXE-7574).
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - run: make test-core
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
