# expect: job gate: `environment-only-secrets` does not fail (`exit 1`) when one of them is non-empty
# Printing the names without failing lets the run pass the keys on.
on: push
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
      - id: environment-only-secrets
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          present=""
          for name in \
            LIVE_PROVIDERS_CANARY \
            OPENAI_API_KEY; do
            if [ -n "${!name}" ]; then present="$present $name"; fi
          done
          echo "$present"
      - uses: actions/checkout@v6
      - run: ./decide.sh
  release:
    needs: [gate]
    uses: ./.github/workflows/pass-called-declares-environment-secrets.yml
    secrets:
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
