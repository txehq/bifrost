# expect: job test-core: names `environment: live-providers` but sets GROQ_API_KEY to a literal that is not in REGISTRATION_ONLY_PLACEHOLDERS
# A provider credential set to a literal the counter does not know: it would count as a key
# that arrived, and a keyless job would never warn (Codex on PR #438).
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          ./.github/workflows/scripts/test-core.sh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: placeholder-for-registration
