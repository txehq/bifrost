# expect: whose live-providers jobs read OPENAI_API_KEY, and does not pass each
# Another secret under the key's name would win over the environment's value.
on: push
jobs:
  release:
    uses: ./.github/workflows/pass-called-declares-environment-secrets.yml
    secrets:
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_KEY_V2 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
