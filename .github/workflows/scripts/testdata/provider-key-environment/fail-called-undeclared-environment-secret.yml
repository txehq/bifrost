# expect: job test-core: names `environment: live-providers` in a called workflow and reads OPENAI_API_KEY, which on.workflow_call.secrets does not declare
# Declaring only the canary is not enough: each key the job reads must be declared too.
on:
  workflow_call:
    secrets:
      LIVE_PROVIDERS_CANARY: {required: false}
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"
          ./.github/workflows/scripts/test-core.sh
