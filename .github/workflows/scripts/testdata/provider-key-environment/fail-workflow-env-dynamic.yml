# expect: the workflow-level env reads secrets dynamically ("${{ secrets['OPENAI_API_KEY'] }}")
# Bracket access in the workflow-level env reaches every job, gated or not.
on: push
env:
  OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
jobs:
  test-core:
    runs-on: ubuntu-24.04
    steps:
      - run: make test-core
