# expect: job test-core: names `environment: live-providers` but has no step that runs `python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/count-provider-keys.py"` as its first command
# A live-providers job that never counts its keys: with none set, its suites skip and it
# still passes, and nothing on the run says so (TXE-8129).
on: workflow_dispatch
jobs:
  test-core:
    environment: live-providers
    runs-on: ubuntu-24.04
    steps:
      - id: live-providers-canary
        env:
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
        run: |
          if [ -z "$LIVE_PROVIDERS_CANARY" ]; then exit 1; fi
      - uses: actions/checkout@v6
      - run: ./.github/workflows/scripts/test-core.sh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
