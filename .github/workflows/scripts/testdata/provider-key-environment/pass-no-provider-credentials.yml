# Release storage and repository tokens are not provider credentials; a comment naming
# ${{ secrets.OPENAI_API_KEY }} is not a read either.
on: push
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      # was: OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: ./publish.sh
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  call-lint:
    uses: ./.github/workflows/workflow-lint.yml
