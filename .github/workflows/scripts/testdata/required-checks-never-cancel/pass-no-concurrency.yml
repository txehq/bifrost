# Two runs on one head each reach their own verdict: nothing cancels either.
on:
  pull_request:
  pull_request_review:
jobs:
  codex-review:
    name: codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Connector review of the PR head
        env:
          CODEX_REVIEW_WAIT_SECONDS: "1500"
        run: bash scripts/codex-review-check.sh
