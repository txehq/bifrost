# expect: sets CODEX_REVIEW_WAIT_SECONDS=1800, not a minute short of timeout-minutes 30
on:
  pull_request_review:
jobs:
  codex-review:
    name: codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Connector review of the PR head
        env:
          CODEX_REVIEW_WAIT_SECONDS: "1800"
        run: true
