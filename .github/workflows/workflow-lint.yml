name: Workflow Lint

# Guards on the workflow definitions themselves. These run on pull requests because
# that is the only point they CAN run: release-pipeline.yml triggers on push to main,
# so a job added there with a broken egress allowlist would first execute during a
# real release, with the release riding on it.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/go.mod"
      - "**/version"

permissions:
  contents: read

jobs:
  check-egress-allowlist:
    name: Egress allowlist covers apt + provider-harness hosts
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # PyYAML only - deliberately no apt-get here, so this job needs no Ubuntu
      # mirror access and stays outside the very rule it enforces.
      #
      # --require-hashes against a checked-in pin: an unpinned `pip install pyyaml`
      # takes whatever the index serves at run time, which is what Scorecard's
      # Pinned-Dependencies check flags. pip verifies every downloaded artifact
      # against requirements/pyyaml.txt and fails closed on a mismatch.
      - name: Install PyYAML
        run: |
          python3 -m pip install --user --disable-pip-version-check \
            --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Check egress allowlists
        run: ./.github/workflows/scripts/check-egress-allowlist.sh

      - name: Check version-format guard
        run: ./.github/workflows/scripts/version-format.test.sh

      - name: Check module path major versions
        run: ./.github/workflows/scripts/module-major.test.sh

      # Release image publication guards. Fake curl/docker only: nothing reaches a registry.
      # They run even when an earlier guard failed, so their own results are always reported.
      - name: Check GHCR tag probe fails closed
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/ghcr-tag-probe.test.sh

      - name: Check manifest scripts never re-push a published version tag
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/docker-manifest-publish.test.sh

      - name: Check every image publication re-checks the registry on each attempt
        if: ${{ !cancelled() }}
        run: python3 .github/workflows/scripts/test-docker-publish-gates.py

      - name: Check every release job honours the memory-regression gate
        if: ${{ !cancelled() }}
        run: python3 .github/workflows/scripts/test-release-memory-gate.py

  helm-publish-index:
    name: Helm index publication keeps fork history
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            get.helm.sh:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same helm the release job pins, so the index behaviour under test is the
      # one that will run.
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.0.0

      # Local fixtures only: packaged charts, a bare git repo standing in for
      # origin, release assets that are plain files. No Pages push, no releases.
      - name: Check Helm index publication
        run: ./.github/workflows/scripts/helm-publish-index.test.sh

      # The registry is a helm shim on PATH: nothing is pushed anywhere.
      - name: Check Helm OCI publication
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/helm-publish-oci.test.sh
