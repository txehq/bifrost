name: Workflow Lint

# Guards on the workflow definitions themselves. These run on pull requests because
# that is the only point they CAN run: release-pipeline.yml triggers on push to main,
# so a job added there with a broken egress allowlist would first execute during a
# real release, with the release riding on it.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/go.mod"
      - "**/version"

permissions:
  contents: read

jobs:
  check-egress-allowlist:
    name: Egress allowlist covers apt + provider-harness hosts
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # PyYAML only - deliberately no apt-get here, so this job needs no Ubuntu
      # mirror access and stays outside the very rule it enforces.
      #
      # --require-hashes against a checked-in pin: an unpinned `pip install pyyaml`
      # takes whatever the index serves at run time, which is what Scorecard's
      # Pinned-Dependencies check flags. pip verifies every downloaded artifact
      # against requirements/pyyaml.txt and fails closed on a mismatch.
      - name: Install PyYAML
        run: |
          python3 -m pip install --user --disable-pip-version-check \
            --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Check egress allowlists
        run: ./.github/workflows/scripts/check-egress-allowlist.sh

      - name: Check version-format guard
        run: ./.github/workflows/scripts/version-format.test.sh

      # Replays release-pipeline.yml conditions: a transport-only release must run and
      # pass the core, CLI, framework and plugin suites it embeds before publishing.
      - name: Check release gates require the embedded suites
        if: ${{ !cancelled() }}
        run: python3 .github/workflows/scripts/test-release-gates.py

      # Fake git/npx/docker/lsof only: an invalid override must fail before any baseline starts.
      - name: Check migration local-binary overrides fail closed
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/migration-local-binaries.test.sh

      # Fake docker/pg_isready only: the wait must outlast the postgres image's init-time socket.
      - name: Check migration tests wait for the real Postgres server
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/migration-postgres-ready.test.sh

      # Throwaway SQLite files only, with the runner image's sqlite3 (no apt here): the faker
      # step must fail on any missing table that is not the counterpart store's.
      - name: Check SQLite faker SQL fails closed
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/migration-sqlite-faker.test.sh

      # Synthetic snapshot files only: the refresher's own matview_refresh_state rows are
      # left out of the before/after comparison, and the seeded row is still held to it.
      - name: Check matview refresh state comparison keeps seeded rows
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/migration-matview-state.test.sh

      # Loopback Python listeners only: the migration tests must refuse a port that the
      # bifrost they started does not serve.
      - name: Check migration tests use only their own server
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/migration-port-owner.test.sh

      # Release image publication guards. Fake curl/docker only: nothing reaches a registry.
      # They run even when an earlier guard failed, so their own results are always reported.
      - name: Check GHCR tag probe fails closed
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/ghcr-tag-probe.test.sh

      - name: Check manifest scripts never re-push a published version tag
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/docker-manifest-publish.test.sh

      - name: Check every image publication re-checks the registry on each attempt
        if: ${{ !cancelled() }}
        run: python3 .github/workflows/scripts/test-docker-publish-gates.py

      # Fake go only: release binaries must build through go.work, as the image does.
      - name: Check release binaries build through the workspace
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/build-executables.test.sh

      # Go only resolves a vN tag (N >= 2) for a module path ending in /vN.
      - name: Check module path major versions
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/module-major.test.sh

  release-no-main-push:
    name: Release scripts leave main to reviewed PRs
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The fixture's shims hand `go mod edit` to a real go: the one the release jobs use.
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"
          cache: false

      # Local fixtures only: a bare origin whose hook rejects main, and shims for the
      # network and build commands. Nothing is pushed, pulled or published.
      - name: Check release scripts never write main
        run: ./.github/workflows/scripts/release-no-main-push.test.sh

      # The real finalize script against a bare stand-in origin and a gh shim: it tags the
      # checked-out commit and asks for the release, with the Go the release job sets up.
      - name: Check the bifrost-http release finalizes
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/release-bifrost-http-finalize.test.sh

  helm-publish-index:
    name: Helm index publication keeps fork history
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            get.helm.sh:443
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same helm the release job pins, so the index behaviour under test is the
      # one that will run.
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.0.0

      # Local fixtures only: packaged charts, a bare git repo standing in for
      # origin, release assets that are plain files. No Pages push, no releases.
      - name: Check Helm index publication
        run: ./.github/workflows/scripts/helm-publish-index.test.sh

      # The registry is a helm shim on PATH: nothing is pushed anywhere.
      - name: Check Helm OCI publication
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/helm-publish-oci.test.sh

      # gh is a shim on PATH: a stable chart version is released plain, a
      # hyphenated one with --prerelease, and the workflow delegates to the script.
      - name: Check Helm release flags
        if: ${{ !cancelled() }}
        run: ./.github/workflows/scripts/helm-release-create.test.sh
