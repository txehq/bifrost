name: OpenAPI Bundle

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/openapi-bundle.yml"
      - "docs/openapi/**"
      - "!docs/openapi/openapi.json"

permissions:
  contents: read

jobs:
  bundle-openapi:
    name: Bundle OpenAPI Spec
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      # Hash-pinned rather than a bare `pip install pyyaml`, so an unverified
      # install never runs here. Shares the pin file with workflow-lint.yml.
      - name: Install dependencies
        run: pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Bundle OpenAPI spec
        working-directory: ./docs/openapi
        run: python bundle.py

      # Check only: main requires a reviewed codex-review check, so a regenerated
      # spec cannot be pushed from here. A stale openapi.json fails the run instead.
      - name: Check openapi.json is regenerated
        run: |
          if [ -n "$(git status --porcelain -- docs/openapi/openapi.json)" ]; then
            git diff --stat -- docs/openapi/openapi.json
            echo "::error::docs/openapi/openapi.json is stale: run 'python bundle.py' in docs/openapi and commit the result in a reviewed PR"
            exit 1
          fi
