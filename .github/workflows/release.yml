name: Release Pipeline

# The entry point of every release (TXE-7566). A push to main, or a dispatch, starts this
# workflow; the gate decides from the git range whether the run may release
# (release-trigger.sh, TXE-7511), and only then does the `release` job call the release jobs
# in release-pipeline.yml.
#
# The concurrency group is on the `release` job, not on this workflow. A caller job's group
# covers the whole called workflow, and a caller job skipped by its `if:` never enters the
# group, so a push that may not release can neither wait behind a release nor replace a
# release run pending in the group (measured with a scratch probe on 2026-11-16, TXE-7566).
# The group cannot be chosen at the workflow level from the push payload: Actions' push payload
# carries no added/modified/removed file lists (TXE-7511, connector P1 on #358).
on:
  push:
    branches: ["main", "v2.0.0"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip all tests and jump directly to release (admin only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    outputs:
      may-release: ${{ steps.trigger.outputs.may-release }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # TXE-7574: provider keys and LIVE_PROVIDERS_CANARY must exist only as secrets of the
      # live-providers environment. release.yml passes each one to release-pipeline.yml under
      # its own name, and the value passed is this caller's own: empty, unless a repository or
      # organization secret of that name exists. Such a secret would reach every called job,
      # including those that name no environment, with no reviewer's approval, and it would win
      # over the environment's value (both measured 2026-11-22). This job names no environment,
      # so it sees exactly those values. It prints names only, and fails before anything is
      # called. check-provider-key-environment.py requires this step to cover every provider
      # credential the caller passes.
      - name: Check that no provider key or canary is a repository or organization secret
        id: environment-only-secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SPEECH_API_KEY: ${{ secrets.AZURE_SPEECH_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_COPILOT_PRIVATE_KEY: ${{ secrets.GITHUB_COPILOT_PRIVATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
          MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          present=""
          for name in \
            ANTHROPIC_API_KEY \
            ASSEMBLYAI_API_KEY \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_SESSION_TOKEN \
            AZURE_API_KEY \
            AZURE_CLIENT_SECRET \
            AZURE_SPEECH_API_KEY \
            BEDROCK_API_KEY \
            CEREBRAS_API_KEY \
            CLOUDFLARE_API_TOKEN \
            COHERE_API_KEY \
            DASHSCOPE_API_KEY \
            DATABRICKS_TOKEN \
            DEEPGRAM_API_KEY \
            DEEPINFRA_API_KEY \
            DEEPSEEK_API_KEY \
            ELEVENLABS_API_KEY \
            FIREWORKS_API_KEY \
            GEMINI_API_KEY \
            GITHUB_COPILOT_PRIVATE_KEY \
            GROQ_API_KEY \
            HUGGING_FACE_API_KEY \
            LIVE_PROVIDERS_CANARY \
            MAXIM_API_KEY \
            MISTRAL_API_KEY \
            NEBIUS_API_KEY \
            OPENAI_API_KEY \
            OPENROUTER_API_KEY \
            PARASAIL_API_KEY \
            PERPLEXITY_API_KEY \
            REPLICATE_API_KEY \
            RUNPOD_API_KEY \
            RUNWARE_API_KEY \
            RUNWAY_API_KEY \
            SARVAM_API_KEY \
            SGL_API_KEY \
            TYPESAFE_API_KEY \
            VERCEL_AI_GATEWAY_API_KEY \
            VERTEX_CREDENTIALS \
            VOYAGE_API_KEY \
            XAI_API_KEY; do
            if [ -n "${!name}" ]; then present="$present $name"; fi
          done
          if [ -n "$present" ]; then
            echo "::error::These names exist as repository or organization secrets:$present. Delete them; provider keys and LIVE_PROVIDERS_CANARY belong only in the live-providers environment (TXE-7574)."
            exit 1
          fi
          echo "No provider key or canary exists as a repository or organization secret."

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # A push may release only when it changes a version file; a dispatch always may.
      - name: Decide whether this run may release
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: ./.github/workflows/scripts/release-trigger.sh "$EVENT_NAME" "$BEFORE_SHA" "$AFTER_SHA"

  release:
    # gate's environment-only-secrets step must pass before any provider key is passed
    # (check-provider-key-environment.py).
    needs: [gate]
    if: needs.gate.outputs.may-release == 'true'
    # One release at a time. GitHub keeps one pending run per group and cancels the older
    # one when another joins; only runs that may release ever join it.
    concurrency:
      group: release-pipeline
      cancel-in-progress: false
    # The called jobs can only narrow these; they need no more than this between them.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-pipeline.yml
    with:
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests }}
    # Every secret release-pipeline.yml declares, each under its own name; never `inherit`
    # (check-provider-key-environment.py). Provider keys and LIVE_PROVIDERS_CANARY are
    # secrets of the live-providers environment only, so this job's own value of each is
    # empty. Passing the name is what lets a called job that names live-providers read the
    # environment's value: without it the job reads empty (TXE-7574, measured 2026-11-22).
    # Any other value (a literal, another secret) would win over the environment's.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ARN: ${{ secrets.AWS_ARN }}
      AWS_BEDROCK_ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
      AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_SPEECH_API_KEY: ${{ secrets.AZURE_SPEECH_API_KEY }}
      AZURE_SPEECH_ENDPOINT: ${{ secrets.AZURE_SPEECH_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      BEDROCK_GUARDRAIL_IDENTIFIER: ${{ secrets.BEDROCK_GUARDRAIL_IDENTIFIER }}
      BIFROST_ENCRYPTION_KEY: ${{ secrets.BIFROST_ENCRYPTION_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_COPILOT_APP_ID: ${{ secrets.GITHUB_COPILOT_APP_ID }}
      GITHUB_COPILOT_INSTALLATION_ID: ${{ secrets.GITHUB_COPILOT_INSTALLATION_ID }}
      GITHUB_COPILOT_PRIVATE_KEY: ${{ secrets.GITHUB_COPILOT_PRIVATE_KEY }}
      GITHUB_COPILOT_REPOSITORY_ID: ${{ secrets.GITHUB_COPILOT_REPOSITORY_ID }}
      GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
      LIVE_PROVIDERS_CANARY: ${{ secrets.LIVE_PROVIDERS_CANARY }}
      MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
      MAXIM_LOG_REPO_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
      REPLICATE_OWNER: ${{ secrets.REPLICATE_OWNER }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_REASONING_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_REASONING_NETWORK_VOLUME_ID }}
      RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
      VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
      VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
      VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
      VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
