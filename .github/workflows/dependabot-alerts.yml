name: Dependabot Alerts to Issues

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly on Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  create-issues:
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Create issues from Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          alerts_response=$(gh api repos/${{ github.repository }}/dependabot/alerts 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if echo "$alerts_response" | grep -qiE 'Dependabot alerts are disabled|HTTP 403'; then
              echo "Dependabot alerts are unavailable for this repository; skipping issue sync."
              exit 0
            fi

            echo "$alerts_response"
            exit "$status"
          fi

          alerts=$(echo "$alerts_response" | jq '[.[] | select(.state == "open")]')

          echo "$alerts" | jq -c '.[]' | while read -r alert; do
            pkg=$(echo "$alert" | jq -r '.dependency.package.name')
            number=$(echo "$alert" | jq -r '.number')
            severity=$(echo "$alert" | jq -r '.security_advisory.severity')
            summary=$(echo "$alert" | jq -r '.security_advisory.summary')
            url=$(echo "$alert" | jq -r '.html_url')
            ecosystem=$(echo "$alert" | jq -r '.dependency.package.ecosystem')

            # Skip if issue already exists for this alert
            existing=$(gh issue list \
              --repo "${{ github.repository }}" \
              --search "Dependabot Alert #${number}" \
              --json number --jq 'length')

            if [ "$existing" = "0" ]; then
              gh issue create \
                --repo "${{ github.repository }}" \
                --title "dep: update ${pkg} (${severity})" \
                --label "dependencies" \
                --body "$(cat <<EOF
          ## Dependabot Alert #${number}

          **Package:** \`${pkg}\`
          **Ecosystem:** ${ecosystem}
          **Severity:** ${severity}

          ${summary}

          [View Alert](${url})
          EOF
              )"
            fi
          done
