name: Action Runtime Guardrails

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/action-runtime-exceptions.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/action-runtime-exceptions.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-action-runtimes:
    name: Check action runtimes
    # Runs scripts from the pull request's own checkout, so a pull request whose head branch
    # is in another repository waits in pr-testing for a reviewer; everyone else lands on
    # ci-trusted-branch. Checked by scripts/test-approval-environment.py (TXE-7597).
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'pr-testing' || 'ci-trusted-branch' }}
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show Ruby version
        run: ruby --version

      - name: Test the checker
        run: ruby .github/workflows/scripts/check-action-runtimes.test.rb

      - name: Check workflow action runtimes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby .github/workflows/scripts/check-action-runtimes.rb
