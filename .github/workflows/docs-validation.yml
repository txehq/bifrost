name: Docs Validation

# Mintlify's broken-links check over docs/: it reports internal page links and assets. Egress
# is blocked to everything but the hosts below (npm, Node, Mintlify), and every failure it has
# reported on main (23 on 2026-11-16) was an internal path, not an external site.
#
# It runs on every pull request, not only after a merge (TXE-7592). Until then it ran only on
# push to main and nobody saw it: main was red from 2026-05-05 (0fda493b8d, an upstream merge
# that linked a placeholder image) to 2026-11-16, and 23 broken links had piled up from later
# upstream syncs. No paths filter on pull_request, so the check reports on every PR head and
# can be made required.
on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-validation.yml"

permissions:
  contents: read

env:
  # Pinned: `@latest` let the checker change under a commit (check-pinned-tools.py).
  MINTLIFY_VERSION: "4.3.38"

jobs:
  check-broken-links:
    name: Check Broken Links
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            ph.mintlify.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "21"

      - name: Check for broken links
        working-directory: ./docs
        run: |
          echo "Checking for broken links in documentation with mintlify ${MINTLIFY_VERSION}..."
          npx --yes "mintlify@${MINTLIFY_VERSION}" broken-links
          echo "✅ No broken links found"
