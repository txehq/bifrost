# Usage and cost related schemas

BifrostLLMUsage:
  type: object
  description: Token usage information
  properties:
    prompt_tokens:
      type: integer
      description: >
        Total input tokens including any prompt-cache tokens (read + write).
        Subtract prompt_tokens_details.cached_read_tokens and
        prompt_tokens_details.cached_write_tokens to get the non-cached portion.
    prompt_tokens_details:
      $ref: "#/ChatPromptTokensDetails"
    completion_tokens:
      type: integer
      description: Number of output/completion tokens generated.
    completion_tokens_details:
      $ref: "#/ChatCompletionTokensDetails"
    total_tokens:
      type: integer
    input_images:
      type: integer
      description: >
        Number of input images the provider billed (Cohere embeddings report it as
        meta.billed_units.images). Present only when the provider reports it.
    processed_tokens:
      type: object
      description: >
        Token counts the provider processed, present only when it reports them apart
        from the billed counts in prompt_tokens and completion_tokens (input_tokens and
        output_tokens on Responses usage). Today: Cohere chat and Responses, usage.tokens
        next to usage.billed_units.
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
    billed_characters:
      type: integer
      description: >
        Number of characters the provider billed (Vertex AI text embeddings report it as
        metadata.billableCharacterCount). Present only when the provider reports it.
    tool_usage:
      $ref: "#/ToolUsage"
    search_context_size:
      type: string
      description: >
        Search context tier the provider reports it billed the request at
        ("low", "medium" or "high"); Perplexity prices its per-request search
        fee by it. Present only when the provider reports it.
    tool_use_prompt_tokens:
      type: integer
      description: >
        Tokens in tool-use prompts: the results of provider-run tools fed back to the
        model (Gemini's toolUsePromptTokenCount). Reported next to prompt_tokens, not
        included in it; total_tokens includes it. Absent when the provider reports none.
    tool_use_prompt_tokens_details:
      $ref: "#/ToolUsePromptTokensDetails"
    cost:
      $ref: "#/BifrostCost"
    vendor_cost:
      $ref: "#/VendorCost"
      description: >
        Money the provider reported for this request, in its own unit. Set only when the provider
        reported it: xAI's cost_in_usd_ticks, as unit usd_ticks. On a stream it is on the final frame.

ToolUsePromptTokensDetails:
  type: object
  description: Per-modality breakdown of tool_use_prompt_tokens, as the provider reports it.
  properties:
    text_tokens:
      type: integer
    audio_tokens:
      type: integer
    image_tokens:
      type: integer
    video_tokens:
      type: integer
    document_tokens:
      type: integer

ToolUsage:
  type: object
  description: >
    Counts of provider-hosted (server-side) tool calls billed per call.
  properties:
    web_search:
      type: object
      properties:
        num_requests:
          type: integer
          description: Number of billable web search calls.
    web_fetch:
      type: object
      description: Present only when the provider reported a non-zero count (Anthropic server_tool_use.web_fetch_requests).
      properties:
        num_requests:
          type: integer
          description: Number of billable web fetch calls.
    code_execution:
      type: object
      description: Present only when the provider reported a non-zero count (Anthropic server_tool_use.code_execution_requests).
      properties:
        num_requests:
          type: integer
          description: Number of billable code execution calls.
    per_tool:
      type: object
      description: >
        Call count of every tool the provider reported one for, keyed by the
        provider's own tool name (Perplexity usage.tool_calls_details.<tool>.invocation).
        Present only when the provider reports per-tool counts.
      additionalProperties:
        type: object
        properties:
          num_requests:
            type: integer
            description: Number of calls of this tool.

ChatPromptTokensDetails:
  type: object
  properties:
    text_tokens:
      type: integer
    audio_tokens:
      type: integer
    image_tokens:
      type: integer
    video_tokens:
      type: integer
      description: >
        Tokens for video input, when the provider reports them apart from the other
        modalities (Gemini and Vertex). Already included in prompt_tokens.
    document_tokens:
      type: integer
      description: >
        Tokens for document (PDF) input, when the provider reports them apart from the
        other modalities (Gemini and Vertex). Already included in prompt_tokens.
    cached_read_tokens:
      type: integer
      description: >
        Tokens served from the prompt cache (cache hit). These tokens are already
        included in prompt_tokens and are billed at the reduced cache-read rate.
        Populated for all providers that support prompt caching (Anthropic, Bedrock,
        OpenAI, Gemini, xAI, etc.).
    cached_video_tokens:
      type: integer
      description: >
        Of cached_read_tokens, the tokens that are video (Gemini and Vertex
        cacheTokensDetails). Already included in both video_tokens and cached_read_tokens.
    cached_write_tokens:
      type: integer
      description: >
        Tokens written to the prompt cache on this request (cache creation / write).
        These tokens are already included in prompt_tokens and are billed at the
        cache-creation rate. Populated for providers that separately report cache
        write tokens (Anthropic, Bedrock).

ChatCompletionTokensDetails:
  type: object
  properties:
    text_tokens:
      type: integer
    accepted_prediction_tokens:
      type: integer
    audio_tokens:
      type: integer
    citation_tokens:
      type: integer
    num_search_queries:
      type: integer
      deprecated: true
      description: Deprecated, use tool_usage.web_search.num_requests. Will be removed in 3.0.0.
    reasoning_tokens:
      type: integer
    image_tokens:
      type: integer
    rejected_prediction_tokens:
      type: integer

BifrostCost:
  type: object
  description: Cost breakdown for the request
  properties:
    input_tokens_cost:
      type: number
    output_tokens_cost:
      type: number
    reasoning_tokens_cost:
      type: number
      description: Cost for reasoning/thinking tokens (reasoning models)
    citation_tokens_cost:
      type: number
      description: Cost for citation tokens
    search_queries_cost:
      type: number
      description: Cost for web search queries
    request_cost:
      type: number
    total_cost:
      type: number

VendorCost:
  type: object
  description: |
    Money or credits the provider reported, copied from its response in its own unit. Never
    computed by Bifrost; the catalog-priced `cost` is a separate field.
  required:
    - amount
    - unit
  properties:
    amount:
      type: number
      description: The amount, in `unit`. A reported zero is kept as 0
    unit:
      type: string
      enum:
        - usd
        - usd_ticks
        - credit
        - unit
      description: "`usd`; `usd_ticks` (xAI, 1e-10 USD each); `credit` (BFL; ElevenLabs character-cost); `unit` (Kling)"
