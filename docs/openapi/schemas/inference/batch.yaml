# Batch API schemas

BatchStatus:
  type: string
  enum:
    - validating
    - failed
    - in_progress
    - finalizing
    - completed
    - expired
    - cancelling
    - canceled
    - ended

BatchEndpoint:
  type: string
  enum:
    - /v1/chat/completions
    - /v1/embeddings
    - /v1/completions
    - /v1/responses
    - /v1/messages
    - /v1/images/generations
    - /v1/images/edits

BatchCreateRequest:
  type: object
  required:
    - model
  properties:
    model:
      type: string
      description: Model in provider/model format
    input_file_id:
      type: string
      description: OpenAI-style file ID
    requests:
      type: array
      items:
        $ref: '#/BatchRequestItem'
      description: |
        Inline requests, one per line of the batch. On `openai` and `azure` the lines are
        uploaded as a JSONL file and the batch is created from it (two upstream calls for
        one batch create); on `azure` each line's `body.model` is replaced by the
        deployment the key maps that model to. On `gemini` and `vertex` each line whose
        `body` is in OpenAI shape is converted with the sync operation's converter, so it
        reaches the vendor with the parameters a sync request with the same body does.
    endpoint:
      $ref: '#/BatchEndpoint'
    completion_window:
      type: string
      description: e.g., "24h"
    metadata:
      type: object
      additionalProperties:
        type: string
      description: |
        Sent to the vendor's own metadata or label field where it has one: the batch
        metadata on `openai` and `azure`, the job's labels on `vertex` (keys and values
        must be valid labels: at most 63 lowercase letters, digits, underscores or dashes;
        an entry that is not is a 400 naming it). `gemini` has no such field; use
        `display_name`, which the batch object and the list return.
    output_expires_after:
      type: object
      description: When the vendor expires the batch's output and error files (`openai`, `azure`).
      required:
        - anchor
        - seconds
      properties:
        anchor:
          type: string
          description: e.g., "created_at"
        seconds:
          type: integer
          description: 3600 to 2592000

BatchRequestItem:
  type: object
  required:
    - custom_id
  properties:
    custom_id:
      type: string
    method:
      type: string
    url:
      type: string
      description: |
        The operation the line runs, e.g. `/v1/chat/completions`. Defaults to the batch's
        `endpoint`. On `gemini` and `vertex` (Gemini models) the supported urls are
        `/v1/chat/completions` and `/v1/images/generations`; any other is a 400 naming
        the line.
    body:
      type: object
      description: |
        The request body in the OpenAI shape of the line's `url`, the same body the sync
        route takes. A `model` here must be the batch's model: a batch runs one model.
    params:
      type: object

BatchCreateResponse:
  type: object
  properties:
    id:
      type: string
    object:
      type: string
    endpoint:
      type: string
    input_file_id:
      type: string
    completion_window:
      type: string
    status:
      $ref: '#/BatchStatus'
    request_counts:
      $ref: '#/BatchRequestCounts'
    metadata:
      type: object
      additionalProperties:
        type: string
    created_at:
      type: integer
      format: int64
    expires_at:
      type: integer
      format: int64
    output_file_id:
      type: string
    error_file_id:
      type: string
    processing_status:
      type: string
    results_url:
      type: string
    operation_name:
      type: string
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

BatchRequestCounts:
  type: object
  properties:
    total:
      type: integer
    completed:
      type: integer
    failed:
      type: integer
    succeeded:
      type: integer
    expired:
      type: integer
    canceled:
      type: integer
    pending:
      type: integer

BatchListResponse:
  type: object
  properties:
    object:
      type: string
    data:
      type: array
      items:
        $ref: '#/BatchRetrieveResponse'
    first_id:
      type: string
    last_id:
      type: string
    has_more:
      type: boolean
    next_cursor:
      type: string
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

BatchRetrieveResponse:
  type: object
  properties:
    id:
      type: string
    object:
      type: string
    endpoint:
      type: string
    input_file_id:
      type: string
    completion_window:
      type: string
    status:
      $ref: '#/BatchStatus'
    request_counts:
      $ref: '#/BatchRequestCounts'
    metadata:
      type: object
      additionalProperties:
        type: string
    created_at:
      type: integer
      format: int64
    expires_at:
      type: integer
      format: int64
    in_progress_at:
      type: integer
      format: int64
    finalizing_at:
      type: integer
      format: int64
    completed_at:
      type: integer
      format: int64
    failed_at:
      type: integer
      format: int64
    expired_at:
      type: integer
      format: int64
    cancelling_at:
      type: integer
      format: int64
    cancelled_at:
      type: integer
      format: int64
    output_file_id:
      type: string
    error_file_id:
      type: string
    errors:
      $ref: '#/BatchErrors'
    processing_status:
      type: string
    results_url:
      type: string
    archived_at:
      type: integer
      format: int64
    operation_name:
      type: string
    done:
      type: boolean
    progress:
      type: integer
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

BatchErrors:
  type: object
  properties:
    object:
      type: string
    data:
      type: array
      items:
        $ref: '#/BatchError'

BatchError:
  type: object
  properties:
    code:
      type: string
    message:
      type: string
    param:
      type: string
    line:
      type: integer

BatchCancelResponse:
  type: object
  properties:
    id:
      type: string
    object:
      type: string
    status:
      $ref: '#/BatchStatus'
    request_counts:
      $ref: '#/BatchRequestCounts'
    cancelling_at:
      type: integer
      format: int64
    cancelled_at:
      type: integer
      format: int64
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

BatchResultsResponse:
  type: object
  properties:
    batch_id:
      type: string
    results:
      type: array
      items:
        $ref: '#/BatchResultItem'
    has_more:
      type: boolean
      description: True when more result lines follow this page.
    next_cursor:
      type: string
      description: Pass as `after` to read the next page. Present when `has_more` is true.
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

BatchResultItem:
  type: object
  properties:
    id:
      type: string
      description: The vendor's own id for the line (`openai`, `azure`), unchanged.
    custom_id:
      type: string
    status:
      type: string
      enum:
        - succeeded
        - failed
        - expired
        - cancelled
      description: |
        The line's outcome. A succeeded line carries `response`, whose `body` is the OpenAI
        shape of the line's `url` with the sync operation's unified `usage`. A failed,
        expired or cancelled line carries the vendor's `error`. Set by `openai`, `azure`,
        `gemini` and `vertex`.
    response:
      $ref: '#/BatchResultResponse'
    result:
      $ref: '#/BatchResultData'
    error:
      $ref: '#/BatchResultError'

BatchResultResponse:
  type: object
  properties:
    status_code:
      type: integer
    request_id:
      type: string
    body:
      type: object

BatchResultData:
  type: object
  properties:
    type:
      type: string
    message:
      type: object

BatchResultError:
  type: object
  properties:
    code:
      type: string
    message:
      type: string
