# Speech API schemas

SpeechRequest:
  type: object
  required:
    - model
    - input
    - voice
  properties:
    model:
      type: string
      description: Model in provider/model format
    input:
      type: string
      description: Text to convert to speech
    fallbacks:
      type: array
      items:
        type: string
    stream_format:
      type: string
      enum: [sse]
      description: Set to "sse" to enable streaming
    voice:
      $ref: '#/SpeechVoiceInput'
    instructions:
      type: string
    response_format:
      type: string
      enum: [mp3, opus, aac, flac, wav, pcm]
    speed:
      type: number
      minimum: 0.25
      maximum: 4.0
    language_code:
      type: string
    pronunciation_dictionary_locators:
      type: array
      items:
        $ref: '#/SpeechPronunciationDictionaryLocator'
    enable_logging:
      type: boolean
    optimize_streaming_latency:
      type: boolean
    with_timestamps:
      type: boolean
    max_output_tokens:
      type: integer
      minimum: 1
      description: >-
        Upper bound on the output tokens the provider may generate for this speech. Gemini sends it as
        generationConfig.maxOutputTokens (its TTS models bill audio output by the token). Sent as given,
        never clamped; a provider that cannot take it answers 400 caller_unsupported_parameter

SpeechVoiceInput:
  oneOf:
    - type: string
    - type: array
      items:
        $ref: '#/VoiceConfig'

VoiceConfig:
  type: object
  required:
    - speaker
    - voice
  properties:
    speaker:
      type: string
    voice:
      type: string

SpeechPronunciationDictionaryLocator:
  type: object
  required:
    - pronunciation_dictionary_id
  properties:
    pronunciation_dictionary_id:
      type: string
    version_id:
      type: string

SpeechResponse:
  type: object
  properties:
    audio:
      type: string
      format: byte
      description: Audio data (binary)
    usage:
      $ref: '#/SpeechUsage'
    alignment:
      $ref: '#/SpeechAlignment'
    normalized_alignment:
      $ref: '#/SpeechAlignment'
    content_type:
      type: string
      description: Media type of the audio as the provider reported or converted it (for example audio/L16;codec=pcm;rate=24000). Omitted when unknown.
    audio_base64:
      type: string
    url:
      type: string
      description: The provider's own link to the audio, for a provider that answers with a link instead of the bytes (DashScope Qwen3-TTS). Bifrost does not download it; `audio` is then empty.
    expires_at:
      type: integer
      format: int64
      description: When `url` stops working, in Unix seconds, as the provider reported it.
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

SpeechUsage:
  type: object
  properties:
    input_tokens:
      type: integer
    output_tokens:
      type: integer
    output_token_details:
      $ref: '#/SpeechUsageOutputTokenDetails'
    total_tokens:
      type: integer
    billed_characters:
      type: integer
      description: Characters the provider reported it billed. Absent when the provider reported none; never Bifrost's own count of the input
    vendor_cost:
      $ref: './usage.yaml#/VendorCost'

SpeechUsageOutputTokenDetails:
  type: object
  description: >-
    The provider's breakdown of the output tokens. Absent when the provider reported none. Reasoning
    tokens are reported beside output_tokens, never added into it
  properties:
    text_tokens:
      type: integer
    audio_tokens:
      type: integer
    reasoning_tokens:
      type: integer
      description: Thought tokens the provider reported (Gemini thoughtsTokenCount)

SpeechAlignment:
  type: object
  properties:
    char_start_times_ms:
      type: array
      items:
        type: number
    char_end_times_ms:
      type: array
      items:
        type: number
    characters:
      type: array
      items:
        type: string

SpeechStreamResponse:
  type: object
  properties:
    type:
      type: string
      enum: [speech.audio.delta, speech.audio.done]
    audio:
      type: string
      format: byte
    usage:
      $ref: '#/SpeechUsage'
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'
