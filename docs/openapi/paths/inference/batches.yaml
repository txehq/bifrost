batches:
  post:
    operationId: createBatch
    summary: Create a batch job
    description: |
      Creates a batch job for asynchronous processing.
    tags:
    - Batch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/batch.yaml#/BatchCreateRequest'
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/batch.yaml#/BatchCreateResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
  get:
    operationId: listBatches
    summary: List batch jobs
    description: |
      Lists batch jobs for a provider.
    tags:
    - Batch
    parameters:
    - name: provider
      in: query
      required: true
      description: Provider to list batches for
      schema:
        $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    - name: limit
      in: query
      description: Maximum number of batches to return
      schema:
        type: integer
        minimum: 1
    - name: after
      in: query
      description: Cursor for pagination
      schema:
        type: string
    - name: before
      in: query
      description: Cursor for pagination
      schema:
        type: string
    - name: filter
      in: query
      description: |
        The vendor's own list filter, sent unchanged. On `vertex` it is the
        batchPredictionJobs filter, e.g. `labels.tokun_batch_id=batch_1` finds a batch by
        the metadata it was created with. Providers with no list filter ignore it.
      schema:
        type: string
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/batch.yaml#/BatchListResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
batches-by-id:
  get:
    operationId: retrieveBatch
    summary: Retrieve a batch job
    description: |
      Retrieves a specific batch job by ID.
    tags:
    - Batch
    parameters:
    - name: batch_id
      in: path
      required: true
      description: The ID of the batch to retrieve
      schema:
        type: string
    - name: provider
      in: query
      required: true
      description: The provider of the batch
      schema:
        $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/batch.yaml#/BatchRetrieveResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
batches-cancel:
  post:
    operationId: cancelBatch
    summary: Cancel a batch job
    description: |
      Cancels a batch job.
    tags:
    - Batch
    parameters:
    - name: batch_id
      in: path
      required: true
      description: The ID of the batch to cancel
      schema:
        type: string
    - name: provider
      in: query
      required: true
      description: The provider of the batch
      schema:
        $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/batch.yaml#/BatchCancelResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
batches-results:
  get:
    operationId: getBatchResults
    summary: Get batch results
    description: |
      Retrieves the result lines of a batch job, one per input line the vendor wrote. On
      `openai` and `azure` the lines of the error file (failed and expired lines) follow
      those of the output file.

      With `limit` the response is one page, read from a streamed download so a result
      file is never held whole; `has_more` and `next_cursor` say whether and where to
      continue. Without `limit` every line is returned in one response.

      Send `x-bf-api-key` (key name) or `x-bf-api-key-id` to use only the key the batch was
      created with: retrieve, cancel and results then make their upstream calls with that
      key alone and report it in `x-bifrost-routing-info-key`. Without it the provider's
      batch-enabled keys are tried in turn.
    tags:
    - Batch
    parameters:
    - name: batch_id
      in: path
      required: true
      description: The ID of the batch
      schema:
        type: string
    - name: provider
      in: query
      required: true
      description: The provider of the batch
      schema:
        $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    - name: limit
      in: query
      description: Page size in result lines. Omit to return every line in one response.
      schema:
        type: integer
        minimum: 1
    - name: after
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/batch.yaml#/BatchResultsResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
