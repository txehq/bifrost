video-remix:
  post:
    operationId: videoRemix
    summary: Remix a video
    description: |
      Creates a new video generation job by remixing an existing video with a new prompt.
      The source video must have a status of "completed" to be remixed.
      Returns a new video generation job that can be polled for completion.
    tags:
    - Videos
    parameters:
    - name: video_id
      in: path
      required: true
      schema:
        type: string
      description: Video ID in format `id:provider` (e.g., `video_abc123:openai`)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/videos.yaml#/VideoRemixRequest'
    responses:
      '200':
        description: |
          Successful response. Returns a new video generation job object.
          Poll the retrieve endpoint to check completion status.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoGenerationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Source video not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []

video-cancel:
  post:
    operationId: videoCancel
    summary: Cancel a video task
    description: |
      Calls the provider's cancel API for the task and returns the task object. The request has no
      body.

      A finished task's video and record are never removed. Where the provider's cancel API is
      also its delete API, the task is queried first and the API is called only while the task is
      queued.

      When the provider has no cancel API, or does not allow cancelling in the task's current
      state, the response is 400 with `extra_fields.error_type` `provider_cancel_unsupported` and
      the task runs on.
    tags:
    - Videos
    parameters:
    - name: video_id
      in: path
      required: true
      schema:
        type: string
      description: Video ID in format `id:provider` (e.g., `video_abc123:openai`)
    responses:
      '200':
        description: Successful response. Returns the task object, with `status` `cancelled`.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoGenerationResponse'
      '400':
        description: |
          Bad request, or the task cannot be cancelled (`extra_fields.error_type`
          `provider_cancel_unsupported`).
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []

video-edit:
  post:
    operationId: videoEdit
    summary: Edit a video
    description: |
      Edits an existing video - prompt-driven editing, upscaling, or background removal, selected
      with `type`. Accepts either `application/json` (with the source as a provider-side ID or a
      URL) or `multipart/form-data` (to upload the source as `video`). Like generation this is an
      asynchronous operation that returns a job ID; poll the retrieve endpoint for completion.
    tags:
    - Videos
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/videos.yaml#/VideoEditRequest'
        multipart/form-data:
          schema:
            $ref: '../../schemas/inference/videos.yaml#/VideoEditMultipartRequest'
    responses:
      '200':
        description: |
          Successful response. Returns a video job object with status information.
          Poll the retrieve endpoint to check completion status.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoGenerationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
