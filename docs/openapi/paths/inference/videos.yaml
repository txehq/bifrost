# Video Generation Endpoints

video-generation:
  post:
    operationId: videoGeneration
    summary: Generate a video
    description: |
      Creates a video generation job from a text prompt. This is an asynchronous operation
      that returns immediately with a job ID. Use the retrieve endpoint to check the status
      and get the video URL when generation is complete.
    tags:
    - Videos
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/videos.yaml#/VideoGenerationRequest'
    responses:
      '200':
        description: |
          Successful response. Returns a video generation job object with status information.
          Poll the retrieve endpoint to check completion status.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoGenerationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
  get:
    operationId: videoList
    summary: List video generation jobs
    description: |
      Lists video generation jobs for a specific provider with one call to the vendor.

      **Filters.** Every query parameter other than `provider`, `after`, `limit` and `order`
      is the vendor's own filter (a time window, a status, a model, a page number or token).
      Bifrost sends each name and value to the vendor unchanged, repeated values included,
      and does not interpret them; which filters exist is the vendor's documentation.
      `provider`, `after`, `limit` and `order` are each sent once: a repeated one is a 400.

      **Paging.** A vendor that pages by cursor returns `has_more` and `last_id`: send
      `last_id` back as `after`. A vendor that pages by a number or a token returns `next`:
      send it back in the vendor's own filter parameter (BytePlus: `page_num`, together
      with `limit` or `page_size`, which a page after the first requires).

      With `x-bf-api-key` or `x-bf-api-key-id` the call is made with that key only.
    tags:
    - Videos
    parameters:
    - name: provider
      in: query
      required: true
      schema:
        type: string
      description: Provider name (e.g., "openai", "gemini")
    - name: after
      in: query
      required: false
      schema:
        type: string
      description: Cursor for pagination - ID of the last item from the previous page
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of results to return
    - name: order
      in: query
      required: false
      schema:
        type: string
        enum:
        - "asc"
        - "desc"
        default: "desc"
      description: Sort order by creation time
    - name: filters
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
      description: |
        The vendor's own filter parameters, each sent as its own query parameter by the
        vendor's name (for example `status=completed&created_after=1762700000`). They reach
        the vendor unchanged.
    responses:
      '200':
        description: Successful response. Returns a paginated list of video generation jobs.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoListResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
video-by-id:
  get:
    operationId: videoRetrieve
    summary: Retrieve a video generation job
    description: |
      Retrieves the status and metadata for a video generation job.
      Use this endpoint to poll for completion status after creating a video generation job.
      When the status is "completed", the response will include a URL to download the video.
    tags:
    - Videos
    parameters:
    - name: video_id
      in: path
      required: true
      schema:
        type: string
      description: Video ID in format `id:provider` (e.g., `video_abc123:openai`)
    responses:
      '200':
        description: Successful response. Returns the video generation job details.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoGenerationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Video not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
  delete:
    operationId: videoDelete
    summary: Delete a video generation job
    description: |
      Deletes a video generation job and its associated assets.
      This operation cannot be undone.
    tags:
    - Videos
    parameters:
    - name: video_id
      in: path
      required: true
      schema:
        type: string
      description: Video ID in format `id:provider` (e.g., `video_abc123:openai`)
    responses:
      '200':
        description: Successful response. Returns deletion confirmation.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/videos.yaml#/VideoDeleteResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Video not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
video-download:
  get:
    operationId: videoDownload
    summary: Download video content
    description: |
      Downloads the binary content of a generated video.
      The video must have a status of "completed" to be downloadable.
      Returns the raw video file (typically MP4 format).

      The file is streamed: Bifrost forwards the vendor's bytes as they arrive and never
      holds the whole file, so its size is not limited by the gateway's memory. The
      response carries `Content-Length` when the vendor states one and is chunked otherwise.
      BytePlus and MiniMax files are fetched whole first (at most 256 MiB). A Vertex video
      written to a Cloud Storage bucket (`gs://`) is read through the Cloud Storage API with
      the key's Google credentials, which need `storage.objects.get` on the bucket.

      With `x-bf-api-key` or `x-bf-api-key-id` the vendor is called with that key only.
    tags:
    - Videos
    parameters:
    - name: video_id
      in: path
      required: true
      schema:
        type: string
      description: Video ID in format `id:provider` (e.g., `video_abc123:openai`)
    - name: variant
      in: query
      required: false
      schema:
        type: string
        enum:
        - "video"
        - "thumbnail"
        - "spritesheet"
      description: Variant of the video content to download (provider-specific)
    responses:
      '200':
        description: Successful response. Returns the video file as binary content.
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Video not found or not yet available
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
