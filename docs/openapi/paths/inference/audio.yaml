speech:
  post:
    operationId: createSpeech
    summary: Create speech
    description: |
      Generates audio from the input text. Returns audio data or streams via SSE.
    tags:
    - Audio
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/speech.yaml#/SpeechRequest'
    responses:
      '200':
        description: |
          Successful response. Without `stream_format` the body is the audio itself, and its
          `Content-Type` names the format actually returned (for example `audio/wav`,
          `audio/flac`, or Gemini's `audio/L16;codec=pcm;rate=24000`), not always `audio/mpeg`.
          The unified usage of that response is in the `x-bifrost-usage` header.
        headers:
          x-bifrost-usage:
            description: |
              The unified speech usage of a non-streaming audio response, as compact JSON
              (the `SpeechUsage` object). Quantities come from what the provider reported;
              absent when the response has no usage.
            schema:
              type: string
              example: '{"input_chars":36,"input_tokens":7,"output_tokens":42,"total_tokens":49}'
        content:
          audio/*:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: '../../schemas/inference/speech.yaml#/SpeechResponse'
          text/event-stream:
            schema:
              $ref: '../../schemas/inference/speech.yaml#/SpeechStreamResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
transcriptions:
  post:
    operationId: createTranscription
    summary: Create transcription
    description: |
      Transcribes audio into text in the input language.
    tags:
    - Audio
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../../schemas/inference/transcription.yaml#/TranscriptionRequest'
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/transcription.yaml#/TranscriptionResponse'
          text/event-stream:
            schema:
              $ref: '../../schemas/inference/transcription.yaml#/TranscriptionStreamResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
