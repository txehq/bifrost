# Image Generation Endpoints

image-generation:
  post:
    operationId: imageGeneration
    summary: Generate an image
    description: |
      Generates images from text prompts using the specified model.
    tags:
    - Images
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageGenerationRequest'
    responses:
      '200':
        description: |
          Successful response. Returns JSON for non-streaming requests, or Server-Sent Events (SSE) stream when `stream=true`.
          When streaming, events are sent with the following event types:
          - `image_generation.partial_image`: Intermediate image chunks with base64-encoded image data
          - `image_generation.completed`: Final event for each image with usage information
          - `error`: Error events with error details
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageGenerationResponse'
          text/event-stream:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageGenerationStreamResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
image-edit:
  post:
    operationId: imageEdit
    summary: Edit an image
    description: |
      Edits an image using a text prompt and optional mask. Accepts either `application/json` (sources
      as URLs or base64 under `images`) or `multipart/form-data` (to upload the image as `image` or
      `image[]`). Requires at least `model`, one image, and `prompt` - the latter except for the
      operation types driven purely by the input image, e.g. `background_removal`. Only the JSON body
      preserves the types of provider-native extra params; multipart carries every value as a string.
    tags:
    - Images
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageEditRequest'
        multipart/form-data:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageEditMultipartRequest'
    responses:
      '200':
        description: |
          Successful response. Returns JSON for non-streaming requests, or Server-Sent Events (SSE) stream when `stream=true`.
          When streaming, events are sent with the following event types:
          - `image_edit.partial_image`: Intermediate image chunks with base64-encoded image data
          - `image_edit.completed`: Final event for each image with usage information
          - `error`: Error events with error details
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageGenerationResponse'
          text/event-stream:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageEditStreamResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
image-variation:
  post:
    operationId: imageVariation
    summary: Create Variation
    description: |
      Creates variations of an image. Request must be sent as multipart/form-data with `model` and `image` (or `image[]`).
      Does not support streaming.
    tags:
    - Images
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageVariationRequest'
    responses:
      '200':
        description: Successful response. Returns JSON with generated image variation(s).
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageGenerationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []

image-generation-task:
  post:
    operationId: imageGenerationTask
    summary: Submit an image generation task
    description: |
      For providers whose image API is itself task-based (BFL). Takes the body of
      `POST /v1/images/generations` plus the task control fields and returns the task object, usually
      `queued`; query it with `GET /v1/images/tasks/{task_id}`. One call to the provider. A provider
      without image tasks answers 400 `unsupported_operation`; a field the provider cannot deliver is
      400 `caller_unsupported_parameter` with no call to the provider.
    tags:
    - Images
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageGenerationTaskRequest'
    responses:
      '200':
        description: Successful response. Returns the task object.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageTaskResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
image-edit-task:
  post:
    operationId: imageEditTask
    summary: Submit an image edit task
    description: |
      The task form of `POST /v1/images/edits`: the same JSON or multipart body plus the task control
      fields. Returns the task object. One call to the provider.
    tags:
    - Images
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageEditTaskRequest'
        multipart/form-data:
          schema:
            $ref: '../../schemas/inference/images.yaml#/ImageEditMultipartRequest'
    responses:
      '200':
        description: Successful response. Returns the task object.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageTaskResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
image-task-retrieve:
  get:
    operationId: imageTaskRetrieve
    summary: Query an image task
    description: |
      Queries the provider once and returns the task object: `status` mapped from the provider's
      `provider_status`, the delivered images in `data` with `expires_at`, `content_filter` when the
      provider blocked the task, and the usage the provider reported.
    tags:
    - Images
    parameters:
    - name: task_id
      in: path
      required: true
      schema:
        type: string
      description: Task ID in format `id:provider`, as the create returned it
    responses:
      '200':
        description: Successful response. Returns the task object.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageTaskResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
image-task-cancel:
  post:
    operationId: imageTaskCancel
    summary: Cancel an image task
    description: |
      Calls the provider's cancel API and returns the task object. The request has no body. When the
      provider has no cancel API (BFL), the response is 400 with `extra_fields.error_type`
      `provider_cancel_unsupported` and the task runs on.
    tags:
    - Images
    parameters:
    - name: task_id
      in: path
      required: true
      schema:
        type: string
      description: Task ID in format `id:provider`, as the create returned it
    responses:
      '200':
        description: Successful response. Returns the task object, with `status` `cancelled`.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/images.yaml#/ImageTaskResponse'
      '400':
        description: |
          Bad request, or the task cannot be cancelled (`extra_fields.error_type`
          `provider_cancel_unsupported`).
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
